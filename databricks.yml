bundle:
  name: lens-iq
  # `engine: direct` is required for the newer DABs resources we lean on -
  # catalogs, schemas, secret_scopes, postgres_projects, sql_warehouses.
  # Without it, `bundle deploy` falls back to the Terraform engine, which
  # doesn't support catalog/schema/postgres resources.
  engine: direct

# Scope what gets uploaded for the Databricks App.
# - exclude the active lockfile: it encodes resolved registry URLs which on a corporate-
#   proxied dev machine point at internal mirrors the Apps platform can't reach.
#   Without a lock, the platform npm install resolves fresh from registry.npmjs.org.
# - exclude tooling caches (.cursor, .vscode, .databricks state, .tmp).
# - exclude build/, tsconfig.tsbuildinfo: the platform runs `npm run build`
#   itself, so shipping our local build/ would just slow upload and get overwritten.
# node_modules/ and other dev caches are already excluded via .gitignore.
sync:
  exclude:
    - bun.lock
    - "**/*.tsbuildinfo"
    - .cursor/
    - .vscode/
    - .databricks/
    # Sample MP4s exceed the 10MB per-file Apps source-export limit, and even
    # the small ones bloat the bundle upload. The client streams them straight
    # from /api/files/sample_videos/raw?path=<file>, which the AppKit files
    # plugin auto-mounts on the `sample_videos` volume
    # (/Volumes/${var.catalog}/${var.schema}/sample_videos). To refresh the
    # volume, re-run `scripts/sync-sample-videos.sh`, which wraps
    # `databricks sync client/public/sample-videos
    # /Volumes/<catalog>/<schema>/sample_videos` (incremental - unchanged
    # MP4s are not re-uploaded).
    - client/public/sample-videos/*.mp4
    # Booth presenter content (talk track markdown + standalone HTML deck)
    # lives in the `presenter_content` UC volume so we can refresh the
    # narrative without redeploying the app. The deck is ~10MB and would
    # bump up against the per-file Apps source limit anyway; the talk
    # track is small but excluded here so the volume stays the single
    # source of truth for both. Sync with scripts/sync-presenter-content.sh.
    - docs/booth-deck.html
    - docs/dais-talk-track.md
    # README demo GIF stays in git for GitHub rendering, but exceeds the
    # 10MB per-file Apps source-export limit so keep it out of the sync.
    - docs/assets/*.gif
    # Research footage parked under .tmp/ (git-ignored).
    - .tmp/

include:
  - resources/schema.yml
  - resources/volumes.yml
  - resources/secret_scope.yml
  - resources/lakebase.yml
  - resources/pipeline.yml
  - resources/app.yml

variables:
  # Catalog + schema for everything UC-related: the demo tables, the frame
  # volumes, the presenter content volume, and the Lakebase schema name.
  # The catalog must exist in the target workspace (catalog creation is
  # workspace-admin work that's intentionally not in the bundle). DABs
  # creates the schema and volumes under it. Server-side code and the
  # app's file-based analytics queries (config/queries/*.sql.tmpl, rendered
  # at boot by server/uc.ts) read DATABRICKS_CATALOG / DATABRICKS_SCHEMA at
  # runtime (set in app.yaml from these defaults), so swapping workspaces is:
  # change these two values + scripts/swap-uc.sh to rewrite the remaining
  # static files (notebooks, Genie JSON, .env, app.yaml) that DABs can't
  # reach.
  catalog:
    description: Existing Unity Catalog catalog name. Must already exist in the target workspace.
    default: reggie_pierce_aws_catalog
  schema:
    description: Schema for demo tables and the frame volume (created by the bundle).
    default: lens_iq
  # `lookup.warehouse` resolves to the SQL warehouse with this display
  # name in the target workspace. Override per-command with
  # `--var "warehouse_id=<id>"` to pin a specific ID instead. SQL
  # warehouse creation is workspace-admin work and intentionally not in
  # the bundle (the typical deploying SP doesn't have create-endpoint
  # permission on most shared workspaces).
  warehouse_id:
    description: SQL Warehouse used by the analytics plugin and Genie space.
  llm_endpoint:
    description: Model serving endpoint used for AI chat (must satisfy llm/v1/chat).
    default: databricks-claude-opus-4-7
  # ─── Genie space ───────────────────────────────────────────────────────
  # ID of the "LensIQ Detections" Genie space backing the "Ask LensIQ" chat
  # (AppKit genie() + @dbx-tools MastraChat Genie toolkit). DABs does not yet
  # declare genie_spaces, so the space is (re-)created by scripts/deploy.sh
  # from resources/genie_space_lensiq_detections.json, which caches the id in
  # `.databricks/state/genie_space_id`. The app reads the id from the
  # DATABRICKS_GENIE_SPACE_ID env var (app.yaml); this bundle var feeds the
  # `genie_space` resource binding in resources/app.yml that grants the app
  # SP CAN_RUN. deploy.sh passes the cached state id via --var on re-deploys;
  # this default is the fallback for a plain `bundle deploy`.
  # OBO scopes for the chat live on the app resource in resources/app.yml
  # (sql, dashboards.genie, serving.serving-endpoints) - same set as the
  # dbx-tools AppKit+Mastra demo.
  genie_space_id:
    description: Genie space ID created by scripts/deploy.sh from resources/genie_space_lensiq_detections.json.
    default: "01f186bee4ce16f1ac00f8b0df1c88d6"
  # ─── Serving endpoint names ────────────────────────────────────────────
  # One endpoint per use case so each detector has its own UC registered
  # model, scale-to-zero schedule, workload size, and version history.
  # Naming convention: `lensiq-<model-slug-with-dashes>`. Must stay in sync
  # with `servingAlias` in client/src/lib/models.ts and the env vars in
  # app.yaml / .env.
  detector_endpoint:
    description: YOLO general-objects endpoint (custom ultralytics PyFunc).
    default: lensiq-detector
  license_plate_endpoint:
    description: License-plate endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-license-plate
  # Spill + wet-floor-sign do NOT have dedicated endpoints. Both run
  # through the `llm_endpoint` foundation model via
  # server/vision-detector.ts (one Claude call per frame covers both
  # classes; the per-frame image-hash cache serves the second
  # /api/detect call for free).
  slip_fall_endpoint:
    description: Slip-and-fall endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-slip-fall
  fog_detector_endpoint:
    description: Standalone Pillow+numpy fog / lens-condition classifier.
    default: lensiq-fog-detector
  face_recognition_endpoint:
    description: InsightFace buffalo_l detector + ArcFace 512-d embedder (PyFunc, scale-to-zero).
    default: lensiq-face-recognition

  # ─── Secret scope (bundle-owned) ──────────────────────────────────────
  # Single scope holds every secret the deploy needs. Scope itself is
  # declared in resources/secret_scope.yml; secret VALUES are put by
  # scripts/deploy.sh on first deploy (it reads ROBOFLOW_API_KEY and
  # TUNNEL_TOKEN from the operator's env or prompts for them).
  secret_scope:
    description: Databricks secret scope holding roboflow_api_key and tunnel_token.
    default: lens-iq
  roboflow_secret_key:
    description: Key inside `secret_scope` that holds the Roboflow API key (cold-start license check on Roboflow detector endpoints).
    default: roboflow_api_key
  apps_tunnel_secret_key:
    description: Key inside `secret_scope` that holds the frp auth token (used only when AZURE_CONTAINER_APPS is set).
    default: tunnel_token

  # ─── Lakebase Autoscaling postgres binding ────────────────────────────
  # The bundle creates the project (resources/lakebase.yml) which
  # auto-provisions a default database on the production branch. The
  # Lakebase resource id for that database is `databricks-postgres`
  # (hyphen - that's the URL path segment); the in-DB Postgres name is
  # `databricks_postgres` (underscore). The app binding in
  # resources/app.yml uses the resource id form. Override per workspace
  # only if you've created an additional named database via
  # `databricks postgres create-database`.
  lakebase_database:
    description: Lakebase resource id of the postgres database under projects/lens-iq/branches/production/databases.
    default: databricks-postgres

targets:
  # Single generic dev target. No `host:` or `profile:` is pinned at the
  # bundle level so the same checkout deploys cleanly to any workspace.
  # Authentication resolves from one of (in priority order):
  #   1. -p <profile> on the CLI invocation
  #   2. DATABRICKS_CONFIG_PROFILE env var (scripts/deploy.sh sources .env
  #      which sets DATABRICKS_CONFIG_PROFILE)
  #   3. DATABRICKS_HOST / DATABRICKS_TOKEN env vars
  #   4. The default profile in ~/.databrickscfg
  # To deploy somewhere else, override the profile or host above; nothing
  # else in this bundle is workspace-specific.
  dev:
    # `mode: production` to skip the dev-mode `dev_${user}_` prefix that
    # `mode: development` bakes into every UC schema name. Every deploy
    # against the booth-demo workspace lands on the SAME shared schema /
    # volumes / app, so per-user prefixing breaks every downstream
    # consumer that hard-codes the unprefixed names (sync scripts, app
    # env vars, SQL queries, README docs). Trade-off: production mode
    # forces an explicit workspace.root_path (see below) so different
    # operators don't clobber each other's bundle state.
    mode: production
    default: true
    workspace:
      # Per-user state path. `${workspace.current_user.userName}` resolves
      # at deploy time to whichever profile is authed, so two operators
      # deploying to the same workspace don't fight over the same
      # bundle state.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    lens-iq-seed:
      name: lens-iq-seed
      tasks:
        - task_key: seed_data
          notebook_task:
            notebook_path: ./notebooks/seed_data.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

    pizza_vision_deploy_yolo:
      name: pizza_vision_deploy_yolo
      tasks:
        - task_key: deploy_yolo
          notebook_task:
            notebook_path: ./notebooks/deploy_yolo.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_name: lensiq_detector
              endpoint_name: ${var.detector_endpoint}

    # Fan-out deploy of the Roboflow-Universe-backed detector endpoints.
    # Each task runs the same parameterized notebook with a different
    # roboflow_{workspace,project,version} triple. Per-task threshold
    # rationale lives in docs/detector-calibration.md; the notebook
    # itself documents the PyFunc / cold-start lifecycle.
    lensiq_deploy_roboflow_detectors:
      name: lensiq_deploy_roboflow_detectors
      tasks:
        - task_key: deploy_license_plate
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: license_plate
              model_display_name: License plates
              roboflow_workspace: samrat-sahoo
              roboflow_project: license-plates-f8vsn
              roboflow_version: "5"
              api_key_scope: ${var.secret_scope}
              api_key_secret: ${var.roboflow_secret_key}
        # Spill + wet-floor-sign tasks intentionally removed. Both
        # detectors now run through Claude vision on the shared
        # `llm_endpoint` (see server/vision-detector.ts), so there is
        # no Roboflow PyFunc to deploy here. If a workspace still has
        # the old `lensiq-spill` / `lensiq-wet-floor-sign` endpoints
        # from a previous deploy, delete them manually with:
        #   databricks serving-endpoints delete lensiq-spill
        #   databricks serving-endpoints delete lensiq-wet-floor-sign
        # Threshold rationale for the remaining Roboflow detectors
        # lives in docs/detector-calibration.md.
        - task_key: deploy_slip_fall
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: slip_fall
              model_display_name: Slip & fall
              roboflow_workspace: sensormatic
              roboflow_project: slip-and-fall
              roboflow_version: "1"
              api_key_scope: ${var.secret_scope}
              api_key_secret: ${var.roboflow_secret_key}

    # Standalone Pillow+numpy classifier. No Roboflow secret, no GPU.
    # Lives in its own job so it can be redeployed without touching the
    # Roboflow fleet.
    lensiq_deploy_fog_detector:
      name: lensiq_deploy_fog_detector
      tasks:
        - task_key: deploy_fog_detector
          notebook_task:
            notebook_path: ./notebooks/deploy_fog_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_name: lensiq_fog_detector
              endpoint_name: ${var.fog_detector_endpoint}

    # InsightFace face-detect + 512-d ArcFace embedder. No external API
    # key; the buffalo_l model pack downloads onto the serving container
    # on the first cold start and stays local thereafter. Matching
    # against known faces is done server-side via pgvector cosine search
    # on the `faces` table that the AppKit server provisions in Lakebase.
    lensiq_deploy_face_recognition:
      name: lensiq_deploy_face_recognition
      tasks:
        - task_key: deploy_face_recognition
          notebook_task:
            notebook_path: ./notebooks/deploy_face_recognition.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_name: lensiq_face_recognition
              endpoint_name: ${var.face_recognition_endpoint}
              det_size: "640"

    pizza_vision_simulate:
      name: pizza_vision_simulate
      tasks:
        - task_key: simulate
          notebook_task:
            notebook_path: ./notebooks/pipeline_simulator.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              cameras: cam01,cam02,cam03
              frames_per_camera: "60"
              cadence_seconds: "2"
