bundle:
  name: lens-iq

# Scope what gets uploaded for the Databricks App.
# - exclude lockfiles: they encode resolved registry URLs which on a corporate-
#   proxied dev machine point at internal mirrors the Apps platform can't reach.
#   Without a lock, the platform npm install resolves fresh from registry.npmjs.org.
# - exclude tooling caches (.cursor, .vscode, .databricks state, .tmp).
# - exclude build/, tsconfig.tsbuildinfo: the platform runs `npm run build`
#   itself, so shipping our local build/ would just slow upload and get overwritten.
# node_modules/ and other dev caches are already excluded via .gitignore.
sync:
  exclude:
    - package-lock.json
    - npm-shrinkwrap.json
    - yarn.lock
    - pnpm-lock.yaml
    - bun.lockb
    - bun.lock
    - "**/*.tsbuildinfo"
    - .cursor/
    - .vscode/
    - .databricks/
    # Sample MP4s exceed the 10MB per-file Apps source-export limit, and even
    # the small ones bloat the bundle upload. The client streams them straight
    # from /api/files/sample_videos/raw?path=<file>, which the AppKit files
    # plugin auto-mounts on the `sample_videos` volume
    # (/Volumes/${var.catalog}/${var.schema}/sample_videos). To refresh the
    # volume, re-run `scripts/sync-sample-videos.sh` (which calls
    # `databricks fs cp client/public/sample-videos/*.mp4
    # dbfs:/Volumes/<catalog>/<schema>/sample_videos/ --overwrite`).
    - client/public/sample-videos/*.mp4
    # Booth presenter content (talk track markdown + standalone HTML deck)
    # lives in the `presenter_content` UC volume so we can refresh the
    # narrative without redeploying the app. The deck is ~10MB and would
    # bump up against the per-file Apps source limit anyway; the talk
    # track is small but excluded here so the volume stays the single
    # source of truth for both. Sync with scripts/sync-presenter-content.sh.
    - docs/booth-deck.html
    - docs/dais-talk-track.md
    # Research footage parked under .tmp/ (git-ignored).
    - .tmp/

include:
  - resources/pipeline.yml
  - resources/app.yml
  - resources/volumes.yml

variables:
  catalog:
    description: Unity Catalog catalog for demo tables and the frame volume.
    default: reggie_pierce_7405614800873570
  schema:
    description: Schema for demo tables and the frame volume.
    default: lensiq
  warehouse_id:
    description: SQL Warehouse used by the analytics plugin.
    default: 6ef03decfb060f8a
  llm_endpoint:
    description: Model serving endpoint used for AI chat (must satisfy llm/v1/chat).
    default: databricks-claude-opus-4-7
  # ─── Genie space ───────────────────────────────────────────────────────
  # ID of the "LensIQ Detections" Genie space backing the in-app chat
  # surface (eventually wired through app.resources.genie_space). The
  # space is currently created out-of-band via the databricks-genie MCP /
  # `databricks genie spaces create` since DABs only ships GA support for
  # binding an existing space to an app, not for declaring the space
  # itself. The serialized config is checked in at
  # resources/genie_space_lensiq_detections.json so the space can be
  # recreated deterministically in any workspace.
  genie_space_id:
    description: Genie space ID for LensIQ Detections (bind via app.resources.genie_space).
    default: 01f15abcc3b51cb4a4c36edf1b0d6e5e
  # ─── Serving endpoint names ────────────────────────────────────────────
  # One endpoint per use case so each detector has its own UC registered
  # model, scale-to-zero schedule, workload size, and version history.
  # Naming convention: `lensiq-<model-slug-with-dashes>`. Must stay in sync
  # with `servingAlias` in client/src/lib/models.ts and the env vars in
  # app.yaml / .env.
  detector_endpoint:
    description: YOLO general-objects endpoint (custom ultralytics PyFunc).
    default: lensiq-detector
  license_plate_endpoint:
    description: License-plate endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-license-plate
  spill_endpoint:
    description: Spill endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-spill
  wet_floor_sign_endpoint:
    description: Wet-floor-sign endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-wet-floor-sign
  cigarette_vape_endpoint:
    description: Cigarette/vape endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-cigarette-vape
  slip_fall_endpoint:
    description: Slip-and-fall endpoint (Roboflow Inference SDK loaded on cold start).
    default: lensiq-slip-fall
  fog_detector_endpoint:
    description: Standalone Pillow+numpy fog / lens-condition classifier.
    default: lensiq-fog-detector

  # ─── Roboflow secret ──────────────────────────────────────────────────
  # Injected into each Roboflow-backed serving endpoint via
  # environment_vars so the Roboflow Inference SDK can authenticate its
  # one-time weight download + license check on cold start. Per-frame
  # inference does NOT use the secret. The deploy notebook also reads it
  # as an existence probe so we don't ship a model version that can never
  # load. The app SP never needs this secret.
  roboflow_secret_scope:
    description: Databricks secret scope holding ROBOFLOW_API_KEY.
    default: reggie_pierce
  roboflow_secret_key:
    description: Key inside roboflow_secret_scope that holds the Roboflow API key.
    default: ROBOFLOW_API_KEY

  # ─── Lakebase Autoscaling postgres binding ────────────────────────────
  # `projects/lens-iq/branches/production/databases/<lakebase_database>` is
  # bound to the app via resources/app.yml -> postgres. The dev workspace
  # has the long-form auto-generated database id (whose postgres-level db
  # name is `lensiq`).
  lakebase_database:
    description: Lakebase Autoscaling database id under projects/lens-iq/branches/production.
    default: db-wb61-xoxc0soijf

  # ─── Apps tunnel token ────────────────────────────────────────────────
  # Databricks secret holding the portr client token. scripts/start.sh
  # interpolates the value into ~/.portr/config.yaml at boot.
  apps_tunnel_secret_scope:
    description: Secret scope holding the portr (apps.dbx.tools) client token.
    default: reggie_pierce
  apps_tunnel_secret_key:
    description: Secret key for the portr client token under apps_tunnel_secret_scope.
    default: apps_dbx_tools_token

targets:
  # Single generic dev target. The `host:` is the workspace URL only; the
  # CLI auto-resolves the matching profile from ~/.databrickscfg by host
  # match, so we deliberately do NOT pin a profile here. To deploy somewhere
  # else, override at the command line:
  #   databricks bundle deploy -t dev -p <profile>
  # or set DATABRICKS_HOST / DATABRICKS_TOKEN in the environment.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405614800873570.10.azuredatabricks.net

resources:
  jobs:
    pizza_vision_seed:
      name: pizza_vision_seed
      tasks:
        - task_key: seed_data
          notebook_task:
            notebook_path: ./notebooks/seed_data.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

    pizza_vision_deploy_yolo:
      name: pizza_vision_deploy_yolo
      tasks:
        - task_key: deploy_yolo
          notebook_task:
            notebook_path: ./notebooks/deploy_yolo.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_name: lensiq_detector
              endpoint_name: ${var.detector_endpoint}

    # Fan-out deploy of the Roboflow-Universe-backed detector endpoints.
    # Each task runs the same parameterized notebook with a different
    # roboflow_{workspace,project,version} triple. Per-task threshold
    # rationale lives in docs/detector-calibration.md; the notebook
    # itself documents the PyFunc / cold-start lifecycle.
    lensiq_deploy_roboflow_detectors:
      name: lensiq_deploy_roboflow_detectors
      tasks:
        - task_key: deploy_license_plate
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: license_plate
              model_display_name: License plates
              roboflow_workspace: samrat-sahoo
              roboflow_project: license-plates-f8vsn
              roboflow_version: "5"
              api_key_scope: ${var.roboflow_secret_scope}
              api_key_secret: ${var.roboflow_secret_key}
        # Threshold rationale (per-detector calibration tables, FP analysis,
        # demo-clip probing) lives in docs/detector-calibration.md.
        - task_key: deploy_spill
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: spill
              model_display_name: Spills
              roboflow_workspace: universe
              roboflow_project: spills-ax5xv
              roboflow_version: "2"
              api_key_scope: ${var.roboflow_secret_scope}
              api_key_secret: ${var.roboflow_secret_key}
              class_label_override: spill
              min_confidence: "0.04"
              min_area_pct: "0.05"
              max_area_pct: "2.0"
              min_y_center_pct: "65.0"
              max_y_center_pct: "95.0"
        - task_key: deploy_wet_floor_sign
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: wet_floor_sign
              model_display_name: Wet floor sign
              roboflow_workspace: frc-5881
              roboflow_project: wet-floor-nhjwl
              roboflow_version: "1"
              api_key_scope: ${var.roboflow_secret_scope}
              api_key_secret: ${var.roboflow_secret_key}
              class_label_override: wet_floor_sign
              min_confidence: "0.50"
              min_area_pct: "0.3"
              max_area_pct: "8.0"
              min_y_center_pct: "40.0"
        - task_key: deploy_cigarette_vape
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: cigarette_vape
              model_display_name: Cigarette / vape
              roboflow_workspace: train-qjr0z
              roboflow_project: cigarette-vape-detection-lagrc-4ypjd
              roboflow_version: "3"
              api_key_scope: ${var.roboflow_secret_scope}
              api_key_secret: ${var.roboflow_secret_key}
        - task_key: deploy_slip_fall
          notebook_task:
            notebook_path: ./notebooks/deploy_roboflow_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_slug: slip_fall
              model_display_name: Slip & fall
              roboflow_workspace: sensormatic
              roboflow_project: slip-and-fall
              roboflow_version: "1"
              api_key_scope: ${var.roboflow_secret_scope}
              api_key_secret: ${var.roboflow_secret_key}

    # Standalone Pillow+numpy classifier. No Roboflow secret, no GPU.
    # Lives in its own job so it can be redeployed without touching the
    # Roboflow fleet.
    lensiq_deploy_fog_detector:
      name: lensiq_deploy_fog_detector
      tasks:
        - task_key: deploy_fog_detector
          notebook_task:
            notebook_path: ./notebooks/deploy_fog_detector.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              registered_name: lensiq_fog_detector
              endpoint_name: ${var.fog_detector_endpoint}

    pizza_vision_simulate:
      name: pizza_vision_simulate
      tasks:
        - task_key: simulate
          notebook_task:
            notebook_path: ./notebooks/pipeline_simulator.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              cameras: cam01,cam02,cam03
              frames_per_camera: "60"
              cadence_seconds: "2"
