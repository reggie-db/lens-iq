command:
  - bash
  - scripts/start.sh
env:
  - name: NODE_ENV
    value: production
  # ─── Unity Catalog target ────────────────────────────────────────────
  # Server constants (server/uc.ts) and direct analytics.query() calls
  # read these at runtime. NOTE: DABs does NOT interpolate ${var.*} inside a
  # standalone app.yaml (only inside databricks.yml's resources.apps.*.config
  # block), so these are literals you swap per workspace with
  # scripts/swap-uc.sh. KEEP IN SYNC with databricks.yml::variables and .env.
  - name: DATABRICKS_CATALOG
    value: reggie_pierce_7405614800873570
  - name: DATABRICKS_SCHEMA
    value: lens_iq
  # ─── Genie space ─────────────────────────────────────────────────────
  # Backs the "Ask LensIQ" chat via the AppKit genie() plugin. The plugin
  # reads this env var and registers the space under the `default` alias
  # (see server/server.ts and client/src/components/AIChatButton.tsx). The
  # app SP gets CAN_RUN on the space via the `genie_space` resource binding
  # in resources/app.yml. Literal for the same reason as catalog/schema
  # above (no ${var} interpolation in standalone app.yaml); swap per
  # workspace. KEEP IN SYNC with databricks.yml::variables.genie_space_id.
  - name: DATABRICKS_GENIE_SPACE_ID
    value: 01f1648d45ec15bebd112142c2c897db
  # ─── Public tunnel (opt-in) ──────────────────────────────────────────
  # scripts/start.sh downloads the portr client (https://github.com/amalshaji/portr)
  # and opens a tunnel only when TUNNEL_SUBDOMAIN is set. portr dials the
  # portr server (TUNNEL_SERVER) over SSH and serves public visitor traffic at
  # https://<TUNNEL_SUBDOMAIN>.<TUNNEL_SERVER>, forwarding it to the local app
  # on DATABRICKS_APP_PORT.
  #
  # TUNNEL_TOKEN is REQUIRED here: it is the portr cli auth token (config
  # secret_key). Without it the portr handshake fails and no tunnel comes up.
  # It is backed by the `tunnel_token` resource binding in resources/app.yml.
  #
  # To opt OUT of the public tunnel: remove (or comment out) the
  # TUNNEL_SUBDOMAIN env var below. With it unset, start.sh skips the portr
  # install entirely and just runs node.
  - name: TUNNEL_SUBDOMAIN
    value: lensiq
  - name: TUNNEL_SERVER
    value: apps.dbx.tools
  - name: TUNNEL_TOKEN
    valueFrom: apps_dbx_tools_token
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  # The serving + files plugins ship a static manifest that always declares
  # a "default" required resource keyed off DATABRICKS_SERVING_ENDPOINT_NAME
  # / DATABRICKS_VOLUME_FILES. In multi-endpoint / multi-volume mode the
  # dynamic resource entries are added on top, but the static defaults still
  # have to resolve at boot. Point them at our primary endpoint + volume so
  # AppKit's resource registry validation passes.
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: llm
  - name: DATABRICKS_SERVING_ENDPOINT_LLM
    valueFrom: llm
  # Per-detector serving endpoints. Each maps to an AppKit `serving()`
  # alias in server/server.ts and an entry in client/src/lib/models.ts.
  - name: DATABRICKS_SERVING_ENDPOINT_DETECTOR
    valueFrom: detector
  - name: DATABRICKS_SERVING_ENDPOINT_LICENSE_PLATE
    valueFrom: license_plate
  # Spill + wet_floor_sign reuse the `llm` endpoint (see
  # server/vision-detector.ts); no dedicated env vars needed.
  - name: DATABRICKS_SERVING_ENDPOINT_SLIP_FALL
    valueFrom: slip_fall
  - name: DATABRICKS_SERVING_ENDPOINT_FOG_DETECTOR
    valueFrom: fog_detector
  - name: DATABRICKS_SERVING_ENDPOINT_FACE_RECOGNITION
    valueFrom: face_recognition
  # Volume paths come from `valueFrom: <binding>` so the Apps platform
  # injects the resolved /Volumes/<catalog>/<schema>/<volume> path at boot.
  # Each binding name below corresponds to an `uc_securable` resource in
  # resources/app.yml. Per Databricks docs, a uc_securable of type=VOLUME
  # resolves to the absolute volume path, not the catalog.schema.name tuple.
  # This avoids the ${var.catalog} / ${var.schema} substitution gap - DABs
  # does not interpolate bundle variables inside app.yaml until CLI
  # 0.283.0+, so plain `value:` strings ship literally as "${var.catalog}".
  - name: DATABRICKS_VOLUME_FILES
    valueFrom: frames
  - name: DATABRICKS_VOLUME_FRAMES
    valueFrom: frames
  - name: DATABRICKS_VOLUME_INBOX
    valueFrom: frames_inbox
  # Read-only volume holding the demo MP4 catalog. The AppKit files plugin
  # auto-mounts it at /api/files/sample_videos/raw?path=<file>; the bundle
  # excludes the local MP4s from the app source so prod always streams from
  # the volume (see databricks.yml -> sync.exclude).
  - name: DATABRICKS_VOLUME_SAMPLE_VIDEOS
    valueFrom: sample_videos
  # Read-only volume holding the booth talk-track markdown and standalone
  # HTML deck. The server.ts custom /api/presenter-content/:id route uses
  # this volume to serve the narrative at runtime so it can be refreshed
  # without a redeploy. Bytes pushed by scripts/sync-presenter-content.sh.
  - name: DATABRICKS_VOLUME_PRESENTER_CONTENT
    valueFrom: presenter_content
  # Lakebase Postgres binding. Only LAKEBASE_ENDPOINT is set here. The Apps
  # platform auto-injects PGHOST / PGDATABASE / PGSSLMODE / PGUSER / PGPORT /
  # PGAPPNAME when the `postgres` resource (resources/app.yml) is bound.
  # Setting PGHOST/PGDATABASE explicitly with `valueFrom: postgres` overrides
  # those with the endpoint resource path string (projects/.../endpoints/...)
  # which then fails DNS lookup inside pg.Pool.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
