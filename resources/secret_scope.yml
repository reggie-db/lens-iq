# Single bundle-owned secret scope that holds every secret the LensIQ deploy
# needs:
#   - roboflow_api_key   For the Roboflow Inference SDK cold-start license
#                        check on the license_plate / slip_fall serving
#                        endpoints. Not needed at runtime by the app SP.
#   - tunnel_token       frp auth token for the public tunnel. Used by
#                        scripts/start.sh when AZURE_CONTAINER_APPS is set in
#                        app.yaml (opt-in public tunnel); optional - only
#                        needed when the frps server requires matching auth.
#
# The scope is declarative; secret VALUES are not - DABs intentionally does
# not encode plaintext secrets. scripts/deploy.sh handles `secrets put-secret`
# after `bundle deploy` so the values arrive in the right place automatically.
resources:
  secret_scopes:
    lensiq_scope:
      name: lens-iq
      backend_type: DATABRICKS
