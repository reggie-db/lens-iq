# Databricks App resource. Enabled by uncommenting the `include:` block in
# databricks.yml after the YOLO serving endpoint exists (i.e. after
# `databricks bundle run pizza_vision_deploy_yolo` completes).
resources:
  apps:
    lens_iq:
      name: lens-iq
      description: LensIQ - computer vision dashboard for QSR / gas stations / convenience stores.
      source_code_path: ../
      # Match the live app's existing compute size so DABs's update
      # payload has a value for the same `compute_size` slot that ends
      # up in update_mask. Without this every `bundle deploy` 400s with
      # `compute_min_instances must be provided when included in
      # update_mask`. MEDIUM is the workspace default at create time
      # (verified via `databricks apps get lens-iq -o json`). Do NOT add
      # compute_min_instances / compute_max_instances here - this
      # workspace returns "Manual instance count configuration is not
      # enabled" for any pinned-instance request; the platform handles
      # autoscaling implicitly.
      compute_size: MEDIUM
      # User-authorization (on-behalf-of-user) scopes. Declared in the bundle
      # so they survive every `bundle run`, which does a full app replacement
      # and would otherwise wipe scopes set through the UI. These let the app
      # call Genie (`dashboards.genie`) and the SQL warehouse (`sql`) with the
      # signed-in user's identity instead of only the SP. The platform adds the
      # iam.access-control / iam.current-user read scopes automatically, so they
      # are not declared here. Requires workspace user authorization (Public
      # Preview) to be enabled, otherwise deploy fails with "user token
      # passthrough not enabled".
      user_api_scopes:
        - sql
        - dashboards.genie
      resources:
        - name: warehouse
          sql_warehouse:
            # Resolves through `var.warehouse_id` which defaults to the
            # bundle-owned lensiq_warehouse (see resources/warehouse.yml).
            # Override at deploy time to point at an existing warehouse.
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        # One serving endpoint per detector use case. Each maps onto an
        # AppKit `serving()` alias of the same name in server/server.ts so
        # routing is "model id -> alias -> endpoint" with no dispatch layer
        # in the middle. Endpoint names are sourced from databricks.yml.
        - name: detector
          serving_endpoint:
            name: ${var.detector_endpoint}
            permission: CAN_QUERY
        # spill + wet_floor_sign are served by Claude on the shared
        # `llm` endpoint above (see server/vision-detector.ts), so no
        # dedicated resource binding is needed for either one.
        - name: fog_detector
          serving_endpoint:
            name: ${var.fog_detector_endpoint}
            permission: CAN_QUERY
        # InsightFace buffalo_l detector + 512-d ArcFace embedder.
        # Deployed by `databricks bundle run lensiq_deploy_face_recognition`
        # (notebooks/deploy_face_recognition.ipynb). The stage step is
        # idempotent + retries with ONNX validation, so the old "flaky"
        # warning no longer applies. Pair with DEPLOY_FACE_RECOGNITION=1
        # in .env so scripts/deploy.sh runs the deploy job automatically;
        # phase 2 of deploy.sh already drops this binding if the endpoint
        # didn't come up, so leaving it on is safe even on workspaces
        # where the deploy job is skipped.
        - name: face_recognition
          serving_endpoint:
            name: ${var.face_recognition_endpoint}
            permission: CAN_QUERY
        # LensIQ Detections Genie space backing the "Ask LensIQ" chat
        # (AppKit genie() plugin + <GenieChat>). Grants the app SP CAN_RUN
        # so it can drive the Genie Conversation API on the user's behalf.
        # The space itself lives in resources/genie_space_lensiq_detections.json
        # and is created/updated out-of-band by scripts/deploy.sh via the
        # databricks-genie MCP, since DABs GA does not yet ship a top-level
        # genie_spaces resource. space_id comes from the bundle var so it
        # tracks the deployed space; the app reads the id from the
        # DATABRICKS_GENIE_SPACE_ID env var in app.yaml.
        - name: genie_space
          genie_space:
            name: LensIQ Detections
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          # Lakebase Autoscaling Postgres backing app-side persistent state
          # (guest_counts written from the Guests page, fog_observations from
          # the Camera Health page). Scale-to-zero (min 0.5 CU) so the demo
          # workspace doesn't burn CU when idle. AppKit's lakebase plugin
          # uses CAN_CONNECT_AND_CREATE so the app SP can both connect and
          # auto-create the schema migrations table on first run.
          #
          # Resource type is `postgres:` (Lakebase Autoscaling), NOT `database:`
          # (which is the legacy Lakebase Provisioned shape and was emitting
          # "unknown field: name" warnings before this fix).
          postgres:
            # Project + production branch are bundle-owned
            # (resources/lakebase.yml). Database defaults to
            # `databricks_postgres` (the standard Autoscaling default that
            # the project auto-creates on first provision).
            branch: projects/lens-iq/branches/production
            database: projects/lens-iq/branches/production/databases/${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        # Volume bindings. The files plugin runs as the app SP (see
        # server/server.ts), so DABs grants READ_VOLUME / WRITE_VOLUME on
        # the volume below at deploy time via `uc_securable`. Note that
        # `uc_securable` is currently limited to the leaf-level grant -
        # USE_CATALOG on the parent catalog and USE_SCHEMA on the parent
        # schema must already be in place (either via `all account users`
        # on the catalog/schema or an out-of-band grant to the SP).
        - name: frames
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.frames
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: frames_inbox
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.frames_inbox
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: sample_videos
          # Volume itself is owned by DABs (see resources/volumes.yml) so
          # `databricks bundle deploy` creates it idempotently. The bytes
          # are pushed in by scripts/sync-sample-videos.sh.
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.sample_videos
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: presenter_content
          # Booth talk-track markdown + standalone HTML deck. Bundle-owned
          # (resources/volumes.yml) so the volume exists after bundle
          # deploy; bytes are pushed by scripts/sync-presenter-content.sh
          # and re-pushed any time the narrative changes - no redeploy
          # required to refresh the UI.
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.presenter_content
            securable_type: VOLUME
            permission: READ_VOLUME
        # portr cli auth token (config secret_key) for the public tunnel.
        # app.yaml reads it with `TUNNEL_TOKEN: valueFrom: apps_dbx_tools_token`,
        # and `valueFrom` only resolves against a resource of this exact name -
        # so the resource NAME here must match the env var's valueFrom. The
        # token is REQUIRED: portr's handshake fails without it, so the tunnel
        # never comes up. Scope + key come from the bundle vars so they track
        # the deploy; the value is put into the scope by scripts/deploy.sh /
        # `secrets put-secret`. Only relevant when TUNNEL_SUBDOMAIN is set in
        # app.yaml.
        - name: apps_dbx_tools_token
          secret:
            scope: ${var.secret_scope}
            key: ${var.apps_tunnel_secret_key}
            permission: READ
