# Databricks App resource. Enabled by uncommenting the `include:` block in
# databricks.yml after the YOLO serving endpoint exists (i.e. after
# `databricks bundle run pizza_vision_deploy_yolo -t racetrac` completes).
resources:
  apps:
    pizza_vision_app:
      name: pizza-vision-app
      description: LensIQ - computer vision dashboard for QSR / gas stations / convenience stores.
      source_code_path: ../
      user_api_scopes:
        - serving.serving-endpoints
        - sql
        - files.files
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: detector
          serving_endpoint:
            name: ${var.detector_endpoint}
            permission: CAN_QUERY
        - name: roboflow_detector
          # Multi-model Roboflow PyFunc deployed by
          # notebooks/deploy_roboflow_models.ipynb. Dispatches by `model_id` so
          # one endpoint covers license plate, spill, wet-floor sign,
          # cigarette/vape, and slip-and-fall detection.
          serving_endpoint:
            name: ${var.roboflow_detector_endpoint}
            permission: CAN_QUERY
        # Volume bindings are deliberately omitted here. Granting the app's
        # service principal USE CATALOG requires MANAGE on the parent catalog,
        # which the deploy user often lacks on shared catalogs. Volume paths
        # are instead supplied as plain env values in app.yaml and accessed
        # on-behalf-of-user by the files plugin, so per-user perms apply.
