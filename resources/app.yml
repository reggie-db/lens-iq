# Databricks App resource. Enabled by uncommenting the `include:` block in
# databricks.yml after the YOLO serving endpoint exists (i.e. after
# `databricks bundle run pizza_vision_deploy_yolo -t racetrac` completes).
resources:
  apps:
    lens_iq:
      name: lens-iq
      description: LensIQ - computer vision dashboard for QSR / gas stations / convenience stores.
      source_code_path: ../
      user_api_scopes:
        - serving.serving-endpoints
        - sql
        - files.files
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        # One serving endpoint per detector use case. Each maps onto an
        # AppKit `serving()` alias of the same name in server/server.ts so
        # routing is "model id -> alias -> endpoint" with no dispatch layer
        # in the middle. Endpoint names are sourced from databricks.yml.
        - name: detector
          serving_endpoint:
            name: ${var.detector_endpoint}
            permission: CAN_QUERY
        - name: license_plate
          serving_endpoint:
            name: ${var.license_plate_endpoint}
            permission: CAN_QUERY
        - name: spill
          serving_endpoint:
            name: ${var.spill_endpoint}
            permission: CAN_QUERY
        - name: wet_floor_sign
          serving_endpoint:
            name: ${var.wet_floor_sign_endpoint}
            permission: CAN_QUERY
        - name: cigarette_vape
          serving_endpoint:
            name: ${var.cigarette_vape_endpoint}
            permission: CAN_QUERY
        - name: slip_fall
          serving_endpoint:
            name: ${var.slip_fall_endpoint}
            permission: CAN_QUERY
        - name: fog_detector
          serving_endpoint:
            name: ${var.fog_detector_endpoint}
            permission: CAN_QUERY
        # LensIQ Detections Genie space. Commented out until the chat
        # surface in the app wires this through (and until the racetrac
        # target has its own space id - see databricks.yml). The space
        # itself lives in resources/genie_space_lensiq_detections.json and
        # is created out-of-band via the databricks-genie MCP, since DABs
        # GA does not yet ship a top-level genie_spaces resource.
        # - name: genie_space
        #   genie_space:
        #     space_id: ${var.genie_space_id}
        #     permission: CAN_RUN
        - name: postgres
          # Lakebase Autoscaling Postgres backing app-side persistent state
          # (guest_counts written from the Guests page, fog_observations from
          # the Camera Health page). Scale-to-zero (min 0.5 CU) so the demo
          # workspace doesn't burn CU when idle. AppKit's lakebase plugin
          # uses CAN_CONNECT_AND_CREATE so the app SP can both connect and
          # auto-create the schema migrations table on first run.
          #
          # Resource type is `postgres:` (Lakebase Autoscaling), NOT `database:`
          # (which is the legacy Lakebase Provisioned shape and was emitting
          # "unknown field: name" warnings before this fix).
          postgres:
            branch: projects/lens-iq/branches/production
            database: projects/lens-iq/branches/production/databases/db-wb61-xoxc0soijf
            permission: CAN_CONNECT_AND_CREATE
        # Volume bindings are deliberately omitted here. Granting the app's
        # service principal USE CATALOG requires MANAGE on the parent catalog,
        # which the deploy user often lacks on shared catalogs. Volume paths
        # are instead supplied as plain env values in app.yaml and accessed
        # on-behalf-of-user by the files plugin, so per-user perms apply.
