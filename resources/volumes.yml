# Declarative Unity Catalog volumes owned by this bundle.
#
# `frames` and `frames_inbox` are NOT declared here. They predate the bundle,
# carry user-generated and pipeline-emitted data, and are managed out-of-band
# (the seed notebook and the SDP pipeline create them as needed). DABs only
# binds them to the app for permission grants - see resources/app.yml.
#
# `sample_videos` is bundle-owned: it's a deterministic read-only mirror of
# client/public/sample-videos/, and we want `databricks bundle deploy` to
# (re-)create it idempotently. The actual bytes are uploaded by
# scripts/sync-sample-videos.sh (called from scripts/deploy.sh).
resources:
  volumes:
    sample_videos:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: sample_videos
      volume_type: MANAGED
      comment: Demo MP4s streamed to the lens-iq app via the AppKit files plugin.
