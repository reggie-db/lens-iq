# Declarative Unity Catalog volumes owned by this bundle. All four volumes
# live under `${var.catalog}.${var.schema}` so swapping workspaces is just a
# value change in databricks.yml.
#
# - sample_videos      Demo MP4s mirrored from client/public/sample-videos/.
#                      Bytes uploaded by scripts/sync-sample-videos.sh after
#                      the bundle creates the volume.
# - presenter_content  Booth talk track markdown + HTML deck served at runtime
#                      so the narrative can be refreshed without redeploying.
#                      Bytes uploaded by scripts/sync-presenter-content.sh.
# - frames             Detection write-back: the app uploads frame JPEGs here
#                      when a detection lands so the UI can fetch the source
#                      image for the bbox overlay. Pipeline reads here too.
# - frames_inbox       Continuous-detection pipeline's input volume. The
#                      pipeline_simulator notebook drops JPEGs into this
#                      volume; the Spark Declarative Pipeline picks them up
#                      via Auto Loader and writes structured detections back
#                      into the `pipeline_frames` table.
resources:
  volumes:
    sample_videos:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: sample_videos
      volume_type: MANAGED
      comment: Demo MP4s streamed to the lens-iq app via the AppKit files plugin.
    presenter_content:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: presenter_content
      volume_type: MANAGED
      comment: Booth talk-track markdown and HTML deck served by the LensIQ app at runtime.
    frames:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: frames
      volume_type: MANAGED
      comment: App-written detection JPEGs (one file per persisted detection).
    frames_inbox:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: frames_inbox
      volume_type: MANAGED
      comment: Lakeflow pipeline input - Auto Loader watches this volume for new JPEGs.
