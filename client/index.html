<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3139" />
    <meta
      name="description"
      content="LensIQ - computer vision for physical retail, powered by Databricks."
    />
    <!-- DM Sans / DM Mono. Loaded here via <link> instead of `@import url(...)`
         inside index.css because Vite inlines the AppKit UI styles.css ahead of
         the font import in the compiled output, and PostCSS rejects an
         `@import` that comes after other rules. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
    />
    <title>LensIQ - powered by Databricks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
