  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>LensIQ — Brand Kit<\u002Ftitle>\n<style>/* ============================================================\n   Databricks Design System — Colors & Type\n   ============================================================ */\n\n/* ---------- Fonts ---------- */\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"b73c515c-2be9-4e3b-907a-f7b56193cc4d\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"c7772626-e967-4a59-8dff-b7f1988cfde8\") format(\"truetype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"4c8f8702-f203-4a40-9946-f971c5390450\") format(\"truetype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"07cc9af3-ff8a-46ad-bca9-bf1751529905\") format(\"truetype\");\n  font-weight: 500;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"71f474cb-9940-41d9-bd10-2db0dd6c3eaa\") format(\"truetype\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"7ad487ea-3ced-4947-8633-22b59b4cb8c1\") format(\"truetype\");\n  font-weight: 700;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Mono\";\n  src: url(\"1cb19f22-31dc-4faf-b2c1-8a98634d6ca2\") format(\"truetype\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Mono\";\n  src: url(\"39b3be02-b0a4-4584-80cd-580f40b6e3e2\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Mono\";\n  src: url(\"fa04e1de-1b38-49ec-8229-3349662aeab4\") format(\"truetype\");\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Mono\";\n  src: url(\"0d235c5b-be76-4398-9612-3fe1bb27bdf8\") format(\"truetype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   Tokens\n   ============================================================ */\n:root {\n  /* ---------- Brand primaries ---------- */\n  --db-lava-600:  #FF3621;   /* primary — hot pop */\n  --db-navy-800:  #1B3139;   /* primary — deep ground */\n  --db-oat-medium:#EEEDE9;\n  --db-oat-light: #F9F7F4;\n  --db-white:     #FFFFFF;\n\n  /* ---------- Lava (red-orange) ---------- */\n  --db-lava-800: #801C17;\n  --db-lava-700: #BD2B26;\n  --db-lava-500: #FF5F46;\n  --db-lava-400: #FF9E94;\n  --db-lava-300: #FABFBA;\n\n  /* ---------- Maroon ---------- */\n  --db-maroon-800: #4A121A;\n  --db-maroon-700: #730D21;\n  --db-maroon-600: #98102A;\n  --db-maroon-500: #AB4057;\n  --db-maroon-400: #BF7080;\n  --db-maroon-300: #D69EA8;\n\n  /* ---------- Yellow ---------- */\n  --db-yellow-800: #7D5319;\n  --db-yellow-700: #BA7B23;\n  --db-yellow-600: #FFAB00;\n  --db-yellow-500: #FCBA33;\n  --db-yellow-400: #FFCC66;\n  --db-yellow-300: #FFDB96;\n\n  /* ---------- Green ---------- */\n  --db-green-800: #095A35;\n  --db-green-700: #00875C;\n  --db-green-600: #00A972;\n  --db-green-500: #42BA91;\n  --db-green-400: #70C4AB;\n  --db-green-300: #9ED6C4;\n\n  /* ---------- Blue ---------- */\n  --db-blue-800: #04355D;\n  --db-blue-700: #0E538B;\n  --db-blue-600: #2272B4;\n  --db-blue-500: #4299E0;\n  --db-blue-400: #8ACAFF;\n  --db-blue-300: #BAE1FC;\n\n  /* ---------- Navy ---------- */\n  --db-navy-900: #0B2026;\n  --db-navy-700: #143D4A;\n  --db-navy-600: #1B5162;\n  --db-navy-500: #618794;\n  --db-navy-400: #90A5B1;\n  --db-navy-300: #C4CCD6;\n\n  /* ---------- Functional grays ---------- */\n  --db-gray-nav:   #303F47;\n  --db-gray-text:  #5A6F77;\n  --db-gray-lines: #DCE0E2;\n\n  /* ---------- Semantic surface ---------- */\n  --bg:            var(--db-oat-light);\n  --bg-canvas:     var(--db-white);\n  --bg-subtle:     var(--db-oat-medium);\n  --bg-inverse:    var(--db-navy-800);\n  --bg-inverse-deep: var(--db-navy-900);\n\n  /* ---------- Semantic foreground ---------- */\n  --fg-1:          var(--db-navy-800);     /* default body */\n  --fg-2:          var(--db-gray-text);    /* secondary */\n  --fg-3:          var(--db-navy-400);     /* tertiary / placeholder */\n  --fg-on-dark:    var(--db-white);\n  --fg-on-dark-2:  var(--db-navy-300);\n  --fg-accent:     var(--db-lava-600);\n  --fg-link:       var(--db-lava-700);\n\n  /* ---------- Semantic borders ---------- */\n  --border:        var(--db-gray-lines);\n  --border-strong: var(--db-navy-300);\n  --border-dark:   var(--db-navy-700);\n\n  /* ---------- Semantic status ---------- */\n  --success:       var(--db-green-700);\n  --success-bg:    var(--db-green-300);\n  --warning:       var(--db-yellow-700);\n  --warning-bg:    var(--db-yellow-300);\n  --danger:        var(--db-lava-700);\n  --danger-bg:     var(--db-lava-300);\n  --info:          var(--db-blue-700);\n  --info-bg:       var(--db-blue-300);\n\n  /* ---------- Type families ---------- */\n  --font-sans: \"DM Sans\", ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --font-mono: \"DM Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --font-display: \"DM Sans\", ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;\n\n  /* ---------- Type scale (used by semantic vars) ---------- */\n  --fs-display-xl: 96px;\n  --fs-display-lg: 72px;\n  --fs-display-md: 56px;\n  --fs-h1:         44px;\n  --fs-h2:         32px;\n  --fs-h3:         24px;\n  --fs-h4:         20px;\n  --fs-body-lg:    18px;\n  --fs-body:       16px;\n  --fs-body-sm:    14px;\n  --fs-caption:    12px;\n  --fs-eyebrow:    13px;\n\n  --lh-tight:   1.05;\n  --lh-snug:    1.2;\n  --lh-normal:  1.45;\n  --lh-relaxed: 1.6;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-eyebrow: 0.08em;\n\n  /* ---------- Spacing (4px base) ---------- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* ---------- Radii ---------- */\n  --radius-none: 0;\n  --radius-xs: 2px;\n  --radius-sm: 4px;\n  --radius-md: 6px;\n  --radius-lg: 12px;\n  --radius-xl: 20px;\n  --radius-pill: 999px;\n\n  /* ---------- Shadows ---------- */\n  --shadow-xs:  0 1px 2px rgba(11,32,38,0.06);\n  --shadow-sm:  0 1px 3px rgba(11,32,38,0.08), 0 1px 2px rgba(11,32,38,0.04);\n  --shadow-md:  0 4px 12px rgba(11,32,38,0.08), 0 1px 3px rgba(11,32,38,0.06);\n  --shadow-lg:  0 12px 32px rgba(11,32,38,0.12), 0 2px 6px rgba(11,32,38,0.06);\n  --shadow-xl:  0 24px 64px rgba(11,32,38,0.18);\n  --shadow-focus: 0 0 0 3px rgba(255, 54, 33, 0.28);\n\n  /* ---------- Motion ---------- */\n  --ease-out:    cubic-bezier(0.2, 0.7, 0.2, 1);\n  --ease-in-out: cubic-bezier(0.5, 0, 0.2, 1);\n  --dur-fast:   120ms;\n  --dur-base:   200ms;\n  --dur-slow:   320ms;\n}\n\n/* ============================================================\n   Element defaults — semantic\n   ============================================================ */\nhtml, body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--fg-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, .h1, .db-h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: 500;\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg-1);\n  margin: 0;\n}\nh2, .h2, .db-h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h2);\n  font-weight: 500;\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg-1);\n  margin: 0;\n}\nh3, .h3, .db-h3 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h3);\n  font-weight: 500;\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n  margin: 0;\n}\nh4, .h4, .db-h4 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h4);\n  font-weight: 500;\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n  margin: 0;\n}\n.db-display-xl { font-size: var(--fs-display-xl); font-weight: 500; line-height: 0.95; letter-spacing: -0.03em; }\n.db-display-lg { font-size: var(--fs-display-lg); font-weight: 500; line-height: var(--lh-tight); letter-spacing: -0.025em; }\n.db-display-md { font-size: var(--fs-display-md); font-weight: 500; line-height: var(--lh-tight); letter-spacing: -0.02em; }\n\np, .db-p {\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-1);\n  margin: 0;\n  text-wrap: pretty;\n}\n.db-body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-relaxed); }\n.db-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--fg-2); }\n.db-caption  { font-size: var(--fs-caption); line-height: var(--lh-normal); color: var(--fg-2); }\n.db-eyebrow  {\n  font-size: var(--fs-eyebrow);\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-eyebrow);\n  color: var(--fg-2);\n}\n\ncode, .db-code, kbd, samp {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n  background: var(--db-oat-medium);\n  padding: 2px 6px;\n  border-radius: var(--radius-sm);\n  color: var(--db-navy-800);\n}\npre {\n  font-family: var(--font-mono);\n  font-size: var(--fs-body-sm);\n  line-height: var(--lh-normal);\n  background: var(--db-navy-900);\n  color: var(--db-oat-light);\n  padding: var(--space-5);\n  border-radius: var(--radius-lg);\n  overflow: auto;\n}\npre code { background: transparent; padding: 0; color: inherit; }\n\na, .db-link {\n  color: var(--fg-link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover, .db-link:hover { color: var(--db-lava-600); text-decoration: underline; text-underline-offset: 3px; }\n\nhr { border: 0; border-top: 1px solid var(--border); margin: var(--space-6) 0; }\n\n/* Selection */\n::selection { background: var(--db-lava-600); color: var(--db-white); }\n<\u002Fstyle>\n<style>\n  :root{\n    --iris-1:#FF9E94; --iris-2:#FF7A66; --iris-3:#FF5F46;\n    --iris-4:#FF3621; --iris-5:#E12D1C; --iris-6:#BD2B26;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;background:var(--db-oat-light);color:var(--fg-1);}\n  .wrap{max-width:1200px;margin:0 auto;padding:72px 40px 120px;}\n\n  /* ---------- masthead ---------- */\n  .eyebrow{display:flex;align-items:center;gap:10px;}\n  .eyebrow .db{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;\n    letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);}\n  .eyebrow .db svg{display:block;}\n  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;\n    padding-bottom:40px;border-bottom:1px solid var(--border);margin-bottom:64px;}\n  h1.title{font-size:64px;font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:18px 0 0;}\n  .masthead p{max-width:330px;font-size:15px;line-height:1.55;color:var(--fg-2);margin:0;}\n\n  /* ---------- section ---------- */\n  .sec-label{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;\n    color:var(--fg-3);margin:0 0 20px;}\n  section{margin-bottom:80px;}\n\n  /* ---------- hero lockup panel ---------- */\n  .hero{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;}\n  .panel{border-radius:14px;border:1px solid var(--border);overflow:hidden;\n    display:flex;align-items:center;justify-content:center;position:relative;background:var(--db-white);}\n  .panel.oat{background:var(--db-oat-light);}\n  .panel.navy{background:var(--db-navy-800);border-color:var(--db-navy-700);}\n  .panel.deep{background:var(--db-navy-900);border-color:var(--db-navy-700);}\n  .panel .cap{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--fg-3);\n    letter-spacing:.02em;}\n  .panel.navy .cap,.panel.deep .cap{color:var(--db-navy-400);}\n  .hero .big{min-height:360px;}\n  .hero .stack{min-height:360px;}\n\n  /* ---------- lockup typographic pieces ---------- */\n  .lk{display:flex;align-items:center;gap:22px;}\n  .lk .wm{display:flex;flex-direction:column;line-height:1;}\n  .wordmark{font-family:var(--font-sans);font-weight:500;letter-spacing:-.035em;\n    color:var(--db-navy-800);line-height:.92;}\n  .wordmark .iq{color:var(--db-navy-800);}\n  .sub{font-family:var(--font-sans);font-weight:400;color:var(--fg-2);letter-spacing:.01em;}\n  .on-dark .wordmark{color:var(--db-white);}\n  .on-dark .sub{color:var(--db-navy-300);}\n\n  /* databricks-style stacked product lockup */\n  .stacklk{display:flex;align-items:center;gap:22px;}\n  .stacklk .lines{display:flex;flex-direction:column;line-height:1.04;}\n  .stacklk .l1{font-weight:500;color:var(--db-navy-800);letter-spacing:-.02em;}\n  .stacklk .l2{font-weight:500;color:var(--db-navy-800);letter-spacing:-.03em;}\n  .on-dark.stacklk .l1,.on-dark.stacklk .l2{color:var(--db-white);}\n\n  /* ---------- grid of asset tiles ---------- */\n  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n  .tile{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--db-white);}\n  .tile .art{height:200px;display:flex;align-items:center;justify-content:center;\n    position:relative;background-color:#fff;\n    background-image:\n      linear-gradient(45deg,#eceae5 25%,transparent 25%),\n      linear-gradient(-45deg,#eceae5 25%,transparent 25%),\n      linear-gradient(45deg,transparent 75%,#eceae5 75%),\n      linear-gradient(-45deg,transparent 75%,#eceae5 75%);\n    background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;}\n  .tile .art.solid-navy{background:var(--db-navy-800);}\n  .tile .art.solid-oat{background:var(--db-oat-medium);background-image:none;}\n  .tile .meta{padding:14px 18px;border-top:1px solid var(--border);\n    display:flex;align-items:center;justify-content:space-between;}\n  .tile .meta .name{font-size:14px;font-weight:500;color:var(--db-navy-800);}\n  .tile .meta .fmt{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);\n    text-transform:uppercase;letter-spacing:.04em;}\n\n  /* app icon squircle */\n  .squircle{background:var(--db-white);border-radius:24%;\n    box-shadow:0 10px 30px rgba(11,32,38,.16);display:flex;align-items:center;justify-content:center;}\n  .squircle.navy{background:var(--db-navy-800);}\n\n  /* construction / shades */\n  .shadeswatches{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);}\n  .shadeswatches .sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px;\n    font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.92);letter-spacing:.02em;}\n  .construct{display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:center;}\n  .note{font-size:14px;line-height:1.6;color:var(--fg-2);}\n  .note strong{color:var(--db-navy-800);font-weight:500;}\n  .note p{margin:0 0 14px;font-size:14px;line-height:1.6;color:var(--fg-2);}\n\n  /* clearspace / misuse mini row */\n  .pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n\n  <!-- MASTHEAD -->\n  <header class=\"masthead\">\n    <div>\n      <div class=\"eyebrow\">\n        <span class=\"db\">\n          <svg width=\"15\" height=\"17\" viewBox=\"0 0 300 331\" aria-hidden=\"true\"><path d=\"M283.923 136.449L150.144 213.624L6.88995 131.168L0 134.982V194.844L150.144 281.115L283.923 204.234V235.926L150.144 313.1L6.88995 230.644L0 234.458V244.729L150.144 331L300 244.729V184.867L293.11 181.052L150.144 263.215L16.0766 186.334V154.643L150.144 231.524L300 145.253V86.2713L292.536 81.8697L150.144 163.739L22.9665 90.9663L150.144 17.8998L254.641 78.055L263.828 72.773V65.4371L150.144 0L0 86.2713V95.6613L150.144 181.933L283.923 104.758V136.449Z\" fill=\"#FF3621\"><\u002Fpath><\u002Fsvg>\n          Powered by Databricks\n        <\u002Fspan>\n      <\u002Fdiv>\n      <h1 class=\"title\">LensIQ Brand Kit<\u002Fh1>\n    <\u002Fdiv>\n    <p>Computer vision for physical retail — turning in-store camera feeds into measurable value on the Databricks Data Intelligence Platform.<\u002Fp>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section>\n    <p class=\"sec-label\">Primary lockup<\u002Fp>\n    <div class=\"hero\">\n      <div class=\"panel oat big\" id=\"hero-primary\"><\u002Fdiv>\n      <div class=\"panel navy stack\" id=\"hero-stack\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LOGO FAMILY -->\n  <section>\n    <p class=\"sec-label\">Logo family<\u002Fp>\n    <div class=\"grid\" id=\"family\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ICON / SHADES -->\n  <section>\n    <p class=\"sec-label\">The aperture mark<\u002Fp>\n    <div class=\"construct\">\n      <div class=\"panel oat\" style=\"height:240px\" id=\"construct-icon\"><\u002Fdiv>\n      <div class=\"note\">\n        <p>The mark is a <strong>six-blade camera aperture<\u002Fstrong> — the literal lens through which LensIQ reads a store. Each blade steps through a different <strong>Lava shade<\u002Fstrong>, giving the iris rotational depth the way Databricks Genie and Lakebase render their product marks in graded oranges rather than a single flat fill.<\u002Fp>\n        <p>Blades swirl clockwise around a small open center, reading as both an <strong>aperture<\u002Fstrong> and an <strong>eye<\u002Fstrong>. Built on a 6×60° grid for clean scaling from 16&nbsp;px favicon to hero.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px\">\n      <div class=\"shadeswatches\" id=\"shades\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ON DARK / REVERSED -->\n  <section>\n    <p class=\"sec-label\">Surfaces<\u002Fp>\n    <div class=\"pairgrid\">\n      <div class=\"panel deep\" style=\"min-height:240px\" id=\"surf-deep\">\n        <span class=\"cap\">Navy 900 · reversed<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"panel\" style=\"min-height:240px;background:#fff\" id=\"surf-white\">\n        <span class=\"cap\">White · full color<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<script>\n/* ---------------- iris generator ---------------- */\nfunction dir(deg){const r=deg*Math.PI/180;return [Math.cos(r),Math.sin(r)];}\nfunction iris(R,r,opts){\n  opts=opts||{};\n  const N=6, phi=opts.phi!==undefined?opts.phi:30, gap=opts.gap!==undefined?opts.gap:3.0, gapIn=opts.gapIn!==undefined?opts.gapIn:7;\n  const shades=opts.shades||['#FF9E94','#FF7A66','#FF5F46','#FF3621','#E12D1C','#BD2B26'];\n  const cx=R, cy=R, step=60;\n  let out='';\n  for(let k=0;k<N;k++){\n    const a=k*step;\n    const [ox1,oy1]=dir(a+gap), [ox2,oy2]=dir(a+step-gap);\n    const [ix1,iy1]=dir(a+phi+gapIn), [ix2,iy2]=dir(a+step+phi-gapIn);\n    const O1=[cx+R*ox1,cy+R*oy1], O2=[cx+R*ox2,cy+R*oy2];\n    const I1=[cx+r*ix1,cy+r*iy1], I2=[cx+r*ix2,cy+r*iy2];\n    const d=`M${O1[0].toFixed(2)},${O1[1].toFixed(2)} A${R},${R} 0 0 1 ${O2[0].toFixed(2)},${O2[1].toFixed(2)} L${I2[0].toFixed(2)},${I2[1].toFixed(2)} L${I1[0].toFixed(2)},${I1[1].toFixed(2)} Z`;\n    out+=`<path d=\"${d}\" fill=\"${shades[k]}\"/>`;\n  }\n  const S=2*R;\n  return `<svg width=\"${S}\" height=\"${S}\" viewBox=\"0 0 ${S} ${S}\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\">${out}<\u002Fsvg>`;\n}\n\n/* ---------------- lockup builders ---------------- */\n// horizontal: icon + LensIQ + sub\nfunction primaryLockup(iconPx, wmPx, dark){\n  const R=iconPx/2;\n  return `<div class=\"lk ${dark?'on-dark':''}\">\n    ${iris(R,R*0.31,{})}\n    <div class=\"wm\">\n      <span class=\"wordmark\" style=\"font-size:${wmPx}px\">Lens<span class=\"iq\">IQ<\u002Fspan><\u002Fspan>\n      <span class=\"sub\" style=\"font-size:${Math.round(wmPx*0.30)}px;margin-top:${Math.round(wmPx*0.16)}px\">powered by Databricks<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n// horizontal wordmark only (no sub)\nfunction wordmarkOnly(wmPx, dark){\n  return `<div class=\"lk ${dark?'on-dark':''}\"><span class=\"wordmark\" style=\"font-size:${wmPx}px\">Lens<span class=\"iq\">IQ<\u002Fspan><\u002Fspan><\u002Fdiv>`;\n}\n// databricks-style stacked: Databricks / LensIQ\nfunction stackedDB(iconPx, linePx, dark){\n  const R=iconPx/2;\n  return `<div class=\"stacklk ${dark?'on-dark':''}\">\n    ${iris(R,R*0.31,{})}\n    <div class=\"lines\">\n      <span class=\"l1\" style=\"font-size:${linePx}px\">Databricks<\u002Fspan>\n      <span class=\"l2\" style=\"font-size:${linePx}px\">LensIQ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n// app icon squircle\nfunction appIcon(boxPx, navy){\n  const inner=Math.round(boxPx*0.62);\n  return `<div class=\"squircle ${navy?'navy':''}\" style=\"width:${boxPx}px;height:${boxPx}px\">${iris(inner/2,inner*0.31/2,{})}<\u002Fdiv>`;\n}\n\n/* ---------------- inject ---------------- */\ndocument.getElementById('hero-primary').insertAdjacentHTML('afterbegin', primaryLockup(92,72,false));\ndocument.getElementById('hero-primary').insertAdjacentHTML('beforeend','<span class=\"cap\">Oat Light · full color<\u002Fspan>');\ndocument.getElementById('hero-stack').innerHTML = stackedDB(78,30,true) + '<span class=\"cap\">Navy 800 · stacked<\u002Fspan>';\n\nconst family=[\n  {art:'', cls:'', html:primaryLockup(64,46,false), name:'Horizontal lockup', fmt:'SVG · PNG'},\n  {art:'', cls:'', html:stackedDB(64,26,false), name:'Databricks stacked', fmt:'SVG · PNG'},\n  {art:'', cls:'', html:wordmarkOnly(48,false), name:'Wordmark', fmt:'SVG · PNG'},\n  {art:'', cls:'', html:iris(58,58*0.31,{}), name:'Aperture icon', fmt:'SVG'},\n  {art:'', cls:'', html:appIcon(120,false), name:'App icon — light', fmt:'PNG'},\n  {art:'solid-navy', cls:'', html:appIcon(120,true), name:'App icon — navy', fmt:'PNG'},\n];\ndocument.getElementById('family').innerHTML = family.map(f=>`\n  <div class=\"tile\">\n    <div class=\"art ${f.art}\">${f.html}<\u002Fdiv>\n    <div class=\"meta\"><span class=\"name\">${f.name}<\u002Fspan><span class=\"fmt\">${f.fmt}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>`).join('');\n\ndocument.getElementById('construct-icon').innerHTML = iris(82,82*0.31,{}) ;\n\nconst shadeList=[['Lava 400','#FF9E94'],['','#FF7A66'],['Lava 500','#FF5F46'],['Lava 600','#FF3621'],['','#E12D1C'],['Lava 700','#BD2B26']];\ndocument.getElementById('shades').innerHTML = shadeList.map(s=>`<div class=\"sw\" style=\"background:${s[1]}\"><span>${s[1]}<\u002Fspan><\u002Fdiv>`).join('');\n\ndocument.getElementById('surf-deep').insertAdjacentHTML('afterbegin', primaryLockup(72,52,true));\ndocument.getElementById('surf-white').insertAdjacentHTML('afterbegin', primaryLockup(72,52,false));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
